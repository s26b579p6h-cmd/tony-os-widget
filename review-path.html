<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Review Path</title><style>:root{color-scheme:light;--ink:#292822;--muted:#6f6b61;--line:rgba(72,64,48,.18);--paper:rgba(255,255,255,.72)}*{box-sizing:border-box}html,body{margin:0;min-width:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:transparent;padding:8px}.review-path{max-width:1180px;margin:0 auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{display:flex;flex-direction:column;min-height:255px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--paper);color:inherit;text-decoration:none;box-shadow:0 5px 16px rgba(48,40,26,.08);transition:transform .16s ease,box-shadow .16s ease}.card:hover,.card:focus-visible{transform:translateY(-2px);box-shadow:0 9px 22px rgba(48,40,26,.14);outline:none}.art{display:block;width:100%;aspect-ratio:2.5/1;object-fit:cover;background:#ddd7ca}.copy{display:flex;flex:1;flex-direction:column;padding:14px 15px 16px}.title{font-size:16px;font-weight:650;line-height:1.25}.description{margin-top:auto;padding-top:10px;font-size:13px;line-height:1.35;color:var(--muted)}.disabled{cursor:default;filter:saturate(.55);opacity:.72}.disabled:hover,.disabled:focus-visible{transform:none;box-shadow:0 5px 16px rgba(48,40,26,.08)}.status{display:inline-block;margin-top:9px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8d7551}@media(max-width:820px){.cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{min-height:235px}}@media(max-width:480px){body{padding:4px}.cards{gap:10px}.card{min-height:215px;border-radius:13px}.copy{padding:11px 12px 13px}.title{font-size:14px}.description{font-size:12px}.status{font-size:10px}}</style></head><body><main class="review-path" aria-label="Review Path"><div class="cards"><a class="card" href="https://app.notion.com/p/3e359e58bea181a8a480dcc23761878b" target="_blank" rel="noopener noreferrer" aria-label="Open Daily Reflection"><img class="art" src="assets/tony/review-daily-reflection.png" alt=""><span class="copy"><span class="title">🌙 Daily Reflection</span><span class="description">Begin today’s reflection</span></span></a><a class="card" href="https://app.notion.com/p/3e459e58bea181338a95cb78e3c0ec6c" target="_blank" rel="noopener noreferrer" aria-label="Open Weekly Campfire"><img class="art" src="assets/tony/review-weekly-campfire.png" alt=""><span class="copy"><span class="title">🔥 Weekly Campfire</span><span class="description">Review the week</span></span></a><a class="card" href="https://app.notion.com/p/3e459e58bea181109973f67da743fce3" target="_blank" rel="noopener noreferrer" aria-label="Open Monthly Horizon"><img class="art" src="assets/tony/review-monthly-horizon.png" alt=""><span class="copy"><span class="title">🌙 Monthly Horizon</span><span class="description">See the longer arc</span></span></a><div class="card disabled" aria-disabled="true"><img class="art" src="assets/tony/review-quarterly-summit.png" alt=""><span class="copy"><span class="title">🏔️ Quarterly Summit</span><span class="description">Coming later</span><span class="status">Not available yet</span></span></div></div></main></body></html>
