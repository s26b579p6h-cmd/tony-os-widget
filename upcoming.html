<html lang="en">
<head>

  <title>Tony OS · Upcoming</title>
  <link rel="stylesheet" href="upcoming.css?v=1">

<body>
  <main class="upcoming-card" aria-label="Tony OS upcoming calendar">

    <section class="content">
      <div class="heading-row">
        <div>
          <p class="eyebrow">LOOKING AHEAD</p>
          <h1><span class="calendar-mark" aria-hidden="true"><span class="calendar-grid">▦</span><span class="calendar-spark">✦</span></span> Upcoming</h1>
        </div>
        <span class="count">3 anchors</span>
      </div>
      <div id="event-list" class="event-list" aria-live="polite"></div>
      <a class="calendar-link" href="https://app.notion.com/p/b7bfc98f40b94329946047be90d902fd" target="_blank" rel="noopener noreferrer">View Calendar <span aria-hidden="true">→</span></a>
    </section>
